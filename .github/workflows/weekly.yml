# Weekly build of the GLOBE plant and emissions database.
# Runs every Monday 05:23 UTC (off the hour, when GitHub's scheduler is less busy) and on demand.
name: weekly-data
on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: weekly-data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test
        run: node --test tests/*.test.mjs
      - name: Build
        run: node build/build.mjs
      - name: Sign
        env:
          GLOBE_DATA_SIGNING_KEY: ${{ secrets.GLOBE_DATA_SIGNING_KEY }}
        run: node build/sign.mjs
      - name: Check the signed release
        run: node build/verify.mjs dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./dist/manifest.json').version")
          tag="data-${version}-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" dist/* --title "Data ${version}" --notes-file <(node build/notes.mjs dist) --latest
      # A commit every week records what was built and keeps the schedule alive
      # (GitHub disables scheduled workflows after 60 days without repository activity).
      - name: Record the build
        run: |
          mkdir -p state
          node -e "const m=require('./dist/manifest.json');require('fs').writeFileSync('state/last-build.json',JSON.stringify({version:m.version,built:m.built,files:m.files.map(f=>({name:f.name,records:f.records,bytes:f.bytes})),sources:m.sources.map(s=>({id:s.id,version:s.version,records:s.records,stale:s.stale}))},null,1)+'\n')"
          git config user.name "globe-data build"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/last-build.json
          git commit -m "Data build $(node -p "require('./dist/manifest.json').version")" || echo "nothing to commit"
          git push
